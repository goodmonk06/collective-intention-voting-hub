version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: intention-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: intention_user
      POSTGRES_PASSWORD: intention_pass
      POSTGRES_DB: intention_hub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intention_user -d intention_hub']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
